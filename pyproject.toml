[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-errors"
version = "0.1.0"
description = "Wraps your commands, explains the true root cause of runtime errors in plain English, and proposes a reviewable fix before touching any file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "better-errors contributors" }]
keywords = ["cli", "debugging", "llm", "developer-tools", "errors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/your-org/better-errors"
Issues = "https://github.com/your-org/better-errors/issues"

[project.scripts]
better-errors = "better_errors.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["better_errors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
